services:
  - type: web
    name: stockshield-backend
    env: node
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npx tsc
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: "file:./render_database.db"
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true
